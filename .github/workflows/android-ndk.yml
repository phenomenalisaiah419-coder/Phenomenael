name: android-ndk

on:
  push:
  pull_request:

jobs:
  arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install NDK
        run: sdkmanager "ndk;30.0.16248370"
      - name: Configure
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/30.0.16248370
        run: >-
          cmake -S android -B build-android
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-26
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Wconversion -Wsign-conversion -Wshadow -Werror"
      - name: Build JNI
        run: cmake --build build-android --target bedrockai_jni --config Release --parallel 2
