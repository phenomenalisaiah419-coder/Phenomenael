name: Android Companion APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'companion/**'
      - 'android/**'
      - 'core/**'
      - 'CMakeLists.txt'
      - '.github/workflows/android-companion-build.yml'

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android build packages
        run: |
          sdkmanager --install \
            "platforms;android-37" \
            "build-tools;36.0.0" \
            "cmake;3.31.6" \
            "ndk;30.0.16248370"
      - name: Build companion APK
        working-directory: companion
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bedrock-companion-debug-apk
          path: companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
